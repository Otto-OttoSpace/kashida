name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # regression corpus: scan JSON matches expected + FP guards (english-*/fp-* = 0)
      - run: node --test test/run.js
      # smoke: the CLI runs and can generate an AI-rules file
      - run: node bin/kashida.js test/fixtures --json
      - run: node bin/kashida.js test/fixtures --init-rules
